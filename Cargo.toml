[package]
name = "longrun"
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
description = "Run finite long-running commands without model polling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/n0rmanc/longrun"
homepage = "https://github.com/n0rmanc/longrun"
documentation = "https://docs.rs/longrun"
readme = "README.md"
keywords = ["codex", "cli", "automation", "process", "hooks"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**", "assets/**", "README.md", "Cargo.toml", "install.sh"]

[dependencies]
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "net", "sync", "signal", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v7", "serde"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }
